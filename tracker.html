<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily and Progress Tracker Dashboard</title>
    <link rel="stylesheet" href="./styles/tracker.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="foryou.html" class="brand-name">ForYou</a>
        </div>
        <ul class="nav-links">
            <li><a href="patient-dashboard.php">Overview</a></li>
            <li><a href="appointment.html">Appointments</a></li>
            <li><a href="tracker.html">Tracker</a></li>
            <li><a href="doctor-availability.html">Doctor Availability</a></li>
        </ul>
    </nav>
<div class="container">


    <div class="content">
        <!-- Journal Entries Section -->
        <div class="journal-entries">
            <h2>Wellness Tracking</h2>
            <form id="journalForm" action="save-journal.php" method="POST">
                <div class="input-group">
                    <label for="exercise">Exercise (min):</label>
                    <input type="number" id="exercise" name="exercise">
                </div>
                <div class="input-group">
                    <label for="sleep">Sleep (hours):</label>
                    <input type="number" id="sleep" name="sleep">
                </div>
                <div class="input-group">
                    <label for="diet">Diet:</label>
                    <input type="text" id="diet" name="diet">
                </div>
                <div class="input-group">
                    <label for="mood">Mood:</label>
                    <input type="text" id="mood" name="mood" placeholder="e.g. Happy 😄">
                </div>
                <div class="input-group">
                    <label for="activities">Journal Entry:</label>
                    <textarea id="activities" name="activities" rows="3" placeholder="e.g. I went for a walk this sunny morning..."></textarea>
                </div>
                <button type="submit">Save Today's Tracker</button>
            </form>
        </div>

        <!-- Progress Section -->
        <div class="progress-tracker">
            <h2>Your Progress</h2>
            <div class="progress-container">
                <div class="progress-item">
                    <h3>Steps</h3>
                    <div class="progress-graph" id="stepsGraph">75%</div>
                </div>
                <div class="progress-item">
                    <h3>Sleep</h3>
                    <div class="progress-graph" id="sleepGraph">75%</div>
                </div>
                <div class="progress-item">
                    <h3>Diet</h3>
                    <div class="progress-graph" id="dietGraph">75%</div>
                </div>
                <div class="progress-item">
                    <h3>Mood</h3>
                    <div class="progress-graph" id="moodGraph">75%</div>
                </div>
                <div class="progress-item">
                    <h3>Exercise</h3>
                    <div class="progress-graph" id="exerciseGraph">75%</div>
                </div>
            </div>
            <h2>Prescription</h2>
            <div id="prescription">
                <!-- Prescription given by doctor will load here -->
            </div>
            <h2>Group Session</h2>
            <div id="group-session">
                <!-- Prescription given by doctor will load here -->
            </div>
        </div>
        </div>
    </div>
</div>

<script src="./Scripts/tracker.js"></script>
</body>
</html>
